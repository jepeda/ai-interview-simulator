]

[[exercise]]
id = "py05"
track = "syntax"
title = "Functions & type hints"
minutes = 10
topics = ["default args", "keyword-only", "*args", "**kwargs", "type hints"]
quickref = ["functions", "typing"]
files = ["backend/workspace/drills/ex05_functions.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex05_functions.py" }]
requirements = '''
Python function signatures are more expressive than TS ones and have one famous trap.

- `add_tag` — has the **mutable default argument** bug. Fix it and don't mutate the caller's list.
- `format_name` — make `middle` and `last_first` keyword-only; implement the formatting.
- `total_cents` — variadic `*amounts` plus a keyword option.
- `build_query` — arbitrary `**params`, skipping `None`.
'''
hints = [
  '''A default like `= []` is created once, when `def` runs, and then shared by every call. The idiom is a `None` default.''',
  '''A bare `*` in a parameter list makes every parameter after it keyword-only.''',
  '''`*amounts` arrives as a tuple, so `sum(amounts)` works. A 10% discount means multiplying by 0.9.''',
  '''`**params` arrives as a dict that preserves argument order. Build `key=value` strings, then `"&".join(...)`.''',
]

[[exercise]]
id = "py06"
track = "syntax"
title = "None handling & truthiness"
minutes = 8
topics = ["None", "Optional", "truthiness", "is None"]
quickref = ["none-truthiness", "typing"]
files = ["backend/workspace/drills/ex06_none_handling.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex06_none_handling.py" }]
requirements = '''
There's no `??` or `?.` in Python, and `0`, `""`, `[]` and `{}` are all falsy.
These bugs are common in real code reviews.

- `display_copay` — `$0.00` is a valid copay. Format with thousands separators.
- `primary_phone` — safely walk a nested structure where any level may be missing or `None`.
- `first_present` — `""` counts as present; only `None` is skipped.
- `member_id_or_self_pay` — strip, and fall back on missing, `None` or blank.
'''
hints = [
  '''`if not x` is true for `0`. When you mean "is it None", write `if x is None`.''',
  '''f-string format spec: `f"{value:,.2f}"` gives thousands separators and 2 decimals.''',
  '''For nested lookups, `d.get("k") or {}` gives you something safe to keep calling `.get` on.''',
  '''A function that falls off the end returns `None` implicitly. `next(generator, default)` is a neat way to find the first match.''',
]

[[exercise]]
id = "py07"
track = "syntax"
title = "Strings & f-strings"
minutes = 8
topics = ["str methods", "f-strings", "format spec", "join/split"]
quickref = ["str"]
files = ["backend/workspace/drills/ex07_strings.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex07_strings.py" }]
requirements = '''
String formatting comes up constantly in interviews.

- `format_member_id` — normalize, then group into 3-character chunks joined by `-`.
- `initials` — handle repeated whitespace.
- `format_money` — negative values render as `-$12.50`, not `$-12.50`.
- `mrn` — zero-pad to 6 digits.
'''
hints = [
  '''`str.replace` can be chained. Chunking a string works exactly like chunking a list (see py02).''',
  '''`s.split()` with **no argument** splits on runs of whitespace and drops empty strings.''',
  '''Format the absolute value with `:,.2f`, then put the sign in front of the `$` yourself.''',
  '''Format spec `06d` means: integer, padded with zeros to width 6.''',
]

[[exercise]]
id = "py08"
track = "syntax"
title = "Sorting"
minutes = 10
topics = ["sorted", "key functions", "tuple keys", "None ordering"]
quickref = ["sorting", "none-truthiness"]
files = ["backend/workspace/drills/ex08_sorting.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex08_sorting.py" }]
requirements = '''
Python sorts with key functions instead of comparators.

- `sort_by_name` — case-insensitive, last then first, **without mutating** the input.
- `newest_first` — sort datetimes descending.
- `by_termination_date` — `None` sorts last. (Comparing `None < date` raises `TypeError`!)
- `rank_providers` — rating descending, then name ascending.
'''
hints = [
  '''`list.sort()` sorts in place and returns `None`. `sorted()` returns a new list.''',
  '''A key can return a tuple. Tuples compare element by element, like a multi-column ORDER BY.''',
  '''For None-last, make the first tuple element a boolean: `False` sorts before `True`. The second element must never be `None`.''',
  '''You can't use `reverse=True` for only one column. Negate the number instead.''',
]

[[exercise]]
id = "py09"
track = "syntax"
title = "Filtering, any/all/next, generators"
minutes = 8
topics = ["any", "all", "next", "generator expressions", "sum"]
quickref = ["iteration", "comprehensions"]
files = ["backend/workspace/drills/ex09_filtering.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex09_filtering.py" }]
requirements = '''
The equivalents of `find`, `some`, `every` and `filter().reduce()`.

- `find_patient` — return the first match or `None` (currently raises `IndexError`).
- `all_claims_verified` / `has_overdue_invoice` — use `all` / `any`.
- `billable_minutes` — has an **operator precedence** bug. Rewrite it as `sum(...)` over a generator.
'''
hints = [
  '''`next(iterator, default)` returns the default instead of raising when the iterator is empty.''',
  '''`any(...)` and `all(...)` take a generator expression directly. No extra brackets are needed.''',
  '''`and` binds tighter than `or`, so `a or b and c` means `a or (b and c)`. Re-read the spec: all three conditions must hold.''',
]

[[exercise]]
id = "py10"
track = "syntax"
title = "Exceptions"
minutes = 12
topics = ["try/except", "raise from", "custom exceptions", "Decimal"]
quickref = ["exceptions"]
files = ["backend/workspace/drills/ex10_exceptions.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex10_exceptions.py" }]
requirements = '''
Parse and validate input, translate low-level errors into domain errors, and keep a batch
going when individual items fail.

- `parse_copay` — strict money parsing. Reject blank, non-numeric, negative and >2 decimal input with `ValueError`.
- `safe_parse_copay` — return `None` on bad input.
- `load_patient` — raise `PatientNotFoundError` **chained** from the `KeyError`.
- `parse_batch` — collect successes and error messages.
'''
hints = [
  '''Use `Decimal`, not `float`, for money. `str.removeprefix("$")` and `.replace(",", "")` clean the input.''',
  '''`Decimal("abc")` raises `decimal.InvalidOperation`. Catch it and re-raise a `ValueError` that includes the original input. `{raw!r}` in an f-string shows quotes.''',
  '''A Decimal's decimal places: `amount.as_tuple().exponent` is -2 for "1.25" and -3 for "1.255".''',
  '''`raise NewError(...) from err` inside an `except KeyError as err:` block sets `__cause__`.''',
]

[[exercise]]
id = "py11"
track = "syntax"
title = "Custom exceptions & context managers"
minutes = 12
topics = ["exception hierarchy", "super().__init__", "with", "@contextmanager", "__enter__/__exit__"]
quickref = ["exceptions", "context-managers", "classes"]
files = ["backend/workspace/drills/ex11_context_managers.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex11_context_managers.py" }]
requirements = '''
`with` blocks are everywhere in Python: DB sessions, files, locks, transactions.

- `EligibilityError` — subclass `ClinicError`, store attributes, produce the specified message.
- `require_eligible` — raise it.
- `audit` — a generator-based context manager that records success **or** failure and re-raises.
- `StagedChanges` — a class-based context manager that only applies changes when the block succeeds.
'''
hints = [
  '''Call `super().__init__(message)` so `str(err)` works, then set your own attributes.''',
  '''Inside an `@contextmanager` function, wrap the `yield` in `try/except`. After recording the error, use a bare `raise` to re-raise it.''',
  '''`__enter__`'s return value is what `as staged` binds to. Which list should the caller append to?''',
  '''`__exit__` returning a truthy value **swallows** the exception. `exc_type is None` means the block succeeded.''',
]

[[exercise]]
id = "py12"
track = "syntax"
title = "Classes & dunder methods"
minutes = 12
topics = ["__init__", "self", "@property", "@classmethod", "__eq__", "__repr__", "__add__"]
quickref = ["classes"]
files = ["backend/workspace/drills/ex12_classes.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex12_classes.py" }]
requirements = '''
Build a small value object (`Money`) and fix a `Patient` class with classic TS-to-Python mistakes.

- `Money` — type-check the constructor, `+` returns `Money`, value equality, `repr` and `str`, and a `from_dollars` **classmethod** without float rounding errors.
- `Patient.full_name` — a property, and it's currently missing something every method needs.
- `Patient.age_on` — account for whether the birthday has happened yet this year.
'''
hints = [
  '''Every instance method's first parameter is `self`. `@property` lets callers write `p.full_name` with no parentheses.''',
  '''Without `__eq__`, `==` compares identity (like `===` on objects). Return `NotImplemented` (not `False`) for foreign types.''',
  '''`isinstance(True, int)` is `True`: bool is a subclass of int.''',
  '''`float("0.29") * 100` is 28.999…. Go through `Decimal(str(dollars))`.''',
  '''Tuples compare lexicographically: `(on.month, on.day) >= (dob.month, dob.day)`.''',
]

