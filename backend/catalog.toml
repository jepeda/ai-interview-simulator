# Exercise catalog: drives the dashboard, the test runner, and reset.
#
#   files  = working copies you edit (repo-relative). Reset restores them from backend/starters.
#   tests  = test suites the dashboard runs (runner = "pytest" | "vitest").
#   track  = "syntax" | "debugging" | "project" | "interview" (the AI-interview simulation; its
#            ticket, feature requests and interviewer notes live in backend/interview/*.toml)
#   root   = folder shown in the editor's file tree. A project with `root` and no `files` treats
#            every file under root as part of the exercise (reset restores all of them).
#   extra_roots = more folders that belong to a `root` exercise (e.g. its frontend).
#   quickref = docs/quickref/<name>.md pages listed first in the Quick ref panel.
#   hints  = revealed one at a time. They nudge; they never contain the full answer.
#            Reference solutions live separately in backend/solutions/.

# ───────────────────────────── Python syntax drills ─────────────────────────────

[[exercise]]
id = "py01"
track = "syntax"
title = "Dictionaries"
minutes = 8
topics = ["dict", "get", "items", "spread"]
quickref = ["dict"]
files = ["backend/workspace/drills/ex01_dicts.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex01_dicts.py" }]
requirements = '''
Four small dict functions. The TS reflexes that break here:

- `obj.missing` is `undefined` in TS, but `d["missing"]` **raises `KeyError`** in Python.
- `Object.assign(a, b)` / `a.update(b)` **mutates**. The spread equivalent is `{**a, **b}` (or `a | b`).
- Iterate key/value pairs with `for key, value in d.items():`.

Fix `get_copay_cents`, `count_by_status` and `merge_preferences`, then implement `invert_index`.
'''
hints = [
  '''`dict.get(key, default)` is the closest thing to `obj[key] ?? default`.''',
  '''In `count_by_status`, the first time you see a status there is nothing to `+= 1`. Read the current count with a default of 0 first.''',
  '''`merge_preferences` must build a *new* dict. Python supports a spread-like syntax with `**` inside a dict literal.''',
  '''`invert_index` needs a loop inside a loop: outer over `.items()`, inner over each list of ids.''',
]

[[exercise]]
id = "py02"
track = "syntax"
title = "Lists, tuples, slicing & unpacking"
minutes = 10
topics = ["list", "tuple", "slice", "enumerate", "zip", "unpacking"]
quickref = ["list-tuple", "iteration"]
files = ["backend/workspace/drills/ex02_lists_tuples.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex02_lists_tuples.py" }]
requirements = '''
Practice the list operations you'd use `slice`, `forEach((x, i) => ...)` and destructuring for in TS.

- `first_and_last` — handle empty and single-item lists.
- `chunk` — split into fixed-size pieces using slices.
- `numbered` — use `enumerate` instead of `range(len(...))`; respect `start`.
- `pair_up` — return `(id, name)` tuples; mismatched lengths must raise `ValueError`.
- `split_head_tail` — star-unpacking; empty input raises `ValueError`.
'''
hints = [
  '''Python indexes from 0, and `items[-1]` is the last element. Check emptiness with `if not items:`.''',
  '''`range(start, stop, step)` gives you chunk start positions; `items[i:i + size]` never raises even past the end.''',
  '''`enumerate(names, start=...)` yields `(index, value)` pairs that you can unpack directly in the `for`.''',
  '''`zip` silently stops at the shorter input. Since Python 3.10 it takes a keyword that makes it strict.''',
  '''`head, *tail = values` works like `const [head, ...tail] = values`.''',
]

[[exercise]]
id = "py03"
track = "syntax"
title = "Comprehensions"
minutes = 8
topics = ["list comprehension", "dict comprehension", "set comprehension"]
quickref = ["comprehensions", "dict", "set"]
files = ["backend/workspace/drills/ex03_comprehensions.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex03_comprehensions.py" }]
requirements = '''
Replace `.filter().map()`, `Object.fromEntries`, `new Set` and `flatMap` with comprehensions.
Each function should be a single `return` statement when you're done.

- `active_emails` — filter by status, skip `None` emails, normalize (strip + lowercase).
- `index_by_id` — dict comprehension.
- `unique_payers` — set comprehension, returned as a **sorted list**.
- `flatten_diagnoses` — nested comprehension.
'''
hints = [
  '''Shape: `[expression for item in items if condition]`. The condition can use `and`.''',
  '''Dict comprehension: `{key_expr: value_expr for item in items}`.''',
  '''A set comprehension uses `{}` with no colon. `sorted(...)` accepts any iterable and returns a list.''',
  '''Nested comprehension `for` clauses read in the same order as nested `for` loops: outer first.''',
]

[[exercise]]
id = "py04"
