]

[[exercise]]
id = "py14"
track = "syntax"
title = "async/await basics"
minutes = 10
topics = ["async def", "await", "asyncio.gather", "asyncio.run"]
quickref = ["async"]
files = ["backend/workspace/drills/ex14_async_basics.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex14_async_basics.py" }]
requirements = '''
Python async works like JS Promises, with two differences: un-awaited coroutines never start,
and sync code needs `asyncio.run()` to start the event loop.

- `is_eligible` — has a missing-`await` bug.
- `check_many` — currently sequential. Make it concurrent (the test checks max in-flight requests).
- `check_many_sync` — call it from synchronous code.
'''
hints = [
  '''"'coroutine' object is not subscriptable" means you're holding the un-awaited call, like using a Promise as if it were the value.''',
  '''`asyncio.gather(*coros)` is `Promise.all`. Note the `*`: it takes separate arguments, not a list.''',
  '''gather returns results in argument order, so you can `zip` them back to the ids.''',
]

[[exercise]]
id = "py15"
track = "syntax"
title = "Async patterns: timeouts, allSettled, limits"
minutes = 15
topics = ["asyncio.timeout", "return_exceptions", "Semaphore"]
quickref = ["async", "exceptions"]
files = ["backend/workspace/drills/ex15_async_patterns.py"]
tests = [{ runner = "pytest", path = "backend/tests/drills/test_ex15_async_patterns.py" }]
requirements = '''
Three production patterns for calling flaky third-party APIs (like a payer's eligibility API).

- `fetch_with_timeout` — give up after `seconds`, return `None`.
- `fetch_all_settled` — like `Promise.allSettled`: one failure must not lose the other results.
- `fetch_limited` — like `p-limit`: at most `limit` concurrent requests, results in input order.
'''
hints = [
  '''Python 3.11+: `async with asyncio.timeout(seconds):` raises the builtin `TimeoutError` when it expires.''',
  '''`gather(..., return_exceptions=True)` puts exception objects in the result list. Check with `isinstance(result, Exception)`.''',
  '''Create one `asyncio.Semaphore(limit)`, wrap each fetch in a small inner `async def` that does `async with sem:`, then gather those.''',
]

