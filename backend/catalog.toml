The standard library replaces a lot of hand-written reduce() code.

- `group_by_provider` — use `defaultdict(list)`, but return a plain `dict`.
- `top_diagnoses` — n most common codes, ties in first-seen order.
- `missing_fields` — a field is missing if absent **or** `None` (but `0` and `""` are present!).
- `shared_patients` — intersection, sorted, no duplicates.
'''
