- `Appointment` — safe mutable default, `status` defaults to the enum, `ends_at` is a property.
- `PlanKey` — immutable and hashable.
- `Claim` — validate in `__post_init__`; `status` is not a constructor argument.
- `cancel` — return a modified **copy**.
'''
hints = [
  '''Run the tests and read the `ValueError` from `dataclasses`. It tells you exactly which helper to use.''',
  '''`@dataclass(frozen=True)` makes instances immutable *and* generates `__hash__`.''',
  '''`field(default=..., init=False)` keeps a field out of `__init__`.''',
