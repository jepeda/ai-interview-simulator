requirements = '''
**Support ticket #4850 (Front desk)**

> I changed a patient's insurance from Aetna to Cigna and hit Save. The success toast
> appeared, but the patient list still says Aetna, and the detail panel shows Aetna even
> after I click the patient again. A hard refresh fixes the list but **not** the detail panel.
> Removing coverage entirely also leaves the old plan on screen.

There are **two** bugs, one on each side of the API:

1. **Backend:** `PATCH /patients/{id}/coverage` writes to the DB, but the response and later
   `GET /patients/{id}` calls still return old data.
2. **Frontend:** `applyPatientUpdate` (used in `setPatients(prev => ...)`) doesn't make
   React re-render the list, and it ignores `null` fields.

Reproduce in the Clinic App tab with "Edit coverage". Both test suites must pass.
'''
hints = [
  '''Backend: `get_patient` reads through `services/patient_cache.py`. Read that module's functions. Which one does nothing call?''',
  '''Frontend: React's `useState` compares the old and new state by reference (`Object.is`). What reference does the function return?''',
  '''Frontend: `if (value)` skips `null`, so clearing a plan never clears it. Prefer building new objects (`map` + spread) over mutating.''',
]

# ───────────────────────────── Project (interview-style, multi-part) ─────────────────────────────

[[exercise]]
id = "proj1"
track = "project"
title = "Telehealth booking service (4 parts)"
minutes = 75
topics = ["unfamiliar codebase", "timezones", "SQLAlchemy", "idempotency", "domain errors", "business rules"]
quickref = ["datetime", "sqlalchemy", "fastapi", "pydantic", "exceptions", "sorting"]
root = "backend/workspace/booking"
tests = [
  { runner = "pytest", path = "backend/tests/booking/test_p1_availability.py" },
  { runner = "pytest", path = "backend/tests/booking/test_p2_matching.py" },
  { runner = "pytest", path = "backend/tests/booking/test_p3_booking.py" },
  { runner = "pytest", path = "backend/tests/booking/test_p4_cancellation.py" },
]
requirements = '''
**Format:** this mirrors the longer interview rounds (CodePair-style, often with an AI assistant allowed),
where you get a small, realistic codebase and 60–90 minutes to debug and extend it. The skill being
tested is **navigating unfamiliar code and following its conventions**, not memorized syntax.

Patients use this service to find an in-network therapist and book a telehealth session. Start with
**`README.md`** in the file tree. It has the codebase tour and the conventions reviewers will check.

| Part | Task | ~Time |
|---|---|---|
| 1 | **Debug** `services/availability.py`: slots show at 4am, overlap existing sessions, never free up after a cancellation, and vanish across timezones | 20 min |
| 2 | **Implement** `services/matching.py`: provider search by state license (with expiry), payer, specialty; no duplicate rows; ranking; pagination | 20 min |
| 3 | **Implement** `book_appointment`: validations, 409 on a taken slot, idempotency keys | 20 min |
| 4 | **Implement** `cancel_appointment`: state rules and the late-cancel fee | 15 min |

Parts build on each other (booking reuses the slot engine), so go in order. The results below are
grouped by part.

**How to work it like the real thing**

- Spend the first 5 minutes reading: README → `timeutil.py` → `errors.py` → the function you're changing.
- Use **F12 / Cmd+click** to jump to definitions across files, and the tree's filter box to find files.
- Read the failing test's name and assertion before reading the code. Tests encode the spec.
- Talk through trade-offs out loud (SQL vs Python filtering, where validation belongs, why idempotency matters).
- Swagger for the running service: http://127.0.0.1:8712/docs
- If AI help is allowed in your interview, practice using it the way interviewers like: small, specific
  prompts, then *verify* the output against the tests and conventions. Don't paste whole files.
'''
hints = [
  '''Part 1: `datetime.combine(day, t, tzinfo=UTC)` builds 09:00 **UTC**. Which timezone are the availability windows in? `timeutil.zone()` gets it.''',
  '''Part 1: "booked" is currently *same start time*. Two intervals overlap when `a_start < b_end and b_start < a_end`. And should a cancelled appointment block anything?''',
  '''Part 1: a viewer's calendar day can contain slots from the provider's previous **or next** local day. Loop over neighbouring provider days, then keep slots whose start falls on `day` once converted to `tz`.''',
  '''Part 2: a JOIN to licenses/payers/specialties returns one row per match, which is where duplicates come from. SQLAlchemy's `Provider.licenses.any(...)` compiles to `EXISTS (...)` and avoids them. (Filtering in Python is also acceptable if you can defend it.)''',
  '''Part 2: case-insensitive matching uses `func.lower(column) == value.lower()`. For NULL ratings last, ordering by `Provider.rating.is_(None)` first puts rated providers (False) first.''',
  '''Part 3: do the idempotency lookup **first** (`repositories/appointments.get_by_idempotency_key`). Compare instants with aware datetimes: `from_db(existing.starts_at) == request.starts_at`.''',
  '''Part 3: validate the slot by calling `open_slots(provider, local_day, provider_tz, appointments, now)` and checking membership. Get `appointments` from `list_for_provider` with a range of a couple of days around `starts_at` (converted with `to_db`).''',
  '''Part 4: `starts_at - now` is a `timedelta`, so compare it to `LATE_CANCEL_WINDOW` with `<` (exactly 24h is not late). Half of an odd cent amount, rounded up, is `(rate + 1) // 2`.''',
]

